<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - LevelUp Crew</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="profile">

    <div class="background">

        <!-- BOTÓN -->
        <div class="menu-toggle" onclick="toggleMenu()">
        ☰
        </div>

        <!-- OVERLAY -->
        <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">

            <div class="sidebar-header">
                <h3>LevelUp</h3>
            </div>

            <a href="profile.html">👤 Cuenta</a>
            <a href="seccion.html">🔄 Cambiar sección</a>
            <a href="#">🏆 Logros</a>
            <a href="#">⚙️ Ajustes</a>
            <a href="#" onclick="cerrarSesion()">🚪 Cerrar sesión</a>

        </div>

        <div class="glow glow1"></div>
        <div class="glow glow2"></div>

        <img src="nutria.webp" class="otter" alt="nutria">

        <div class="container">

            <!-- PERFIL -->
            <div class="profile-main">
                <img src="avatar1.png" class="avatar-large">
                <h2 id="perfil-nombre">...</h2>
                <p id="perfil-nivel">Nivel 1</p>
            </div>

            <!-- XP -->
            <div class="profile-card">
                <h3>Progreso</h3>
                <div class="xp-bar">
                <div class="xp-progress" id="perfil-xp-barra" style="width:0%"></div>
                </div>
                <p id="perfil-xp-texto">0 / 100 XP</p>
            </div>

            <!-- STATS -->
            <div class="stats">

                <div class="stat-box">
                    <h3>🔥 <span id="perfil-racha">0</span></h3>
                    <p>Racha</p>
                </div>

                <div class="stat-box">
                    <h3>🏆 <span id="perfil-logros">0</span></h3>
                    <p>Logros</p>
                </div>

                <div class="stat-box">
                    <h3>✅ <span id="perfil-tareas">0</span></h3>
                    <p>Tareas</p>
                </div>

            </div>

        </div>

            <!-- NAV -->
            <div class="bottom-nav">

                <a href="home.html" class="nav-item">
                    <span class="icon">🏠</span>
                    <span class="label">Home</span>
                </a>

                <a href="ranking.html" class="nav-item">
                    <span class="icon">🏆</span>
                    <span class="label">Ranking</span>
                </a>

                <a href="tareas.html" class="nav-item">
                    <span class="icon">🎯</span>
                    <span class="label">Tareas</span>
                </a>

                <a href="perfil.html" class="nav-item active">
                    <span class="icon">👤</span>
                    <span class="label">Perfil</span>
                </a>

            </div>

        <script src="js/app.js"></script>
        
    </div>

</body>
</html>
