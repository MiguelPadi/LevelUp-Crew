services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: python_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app_network
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 5000 backend.asgi:application

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: react_native_app
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - API_URL=http://3.134.77.54:5000
    networks:
      - app_network
    stdin_open: true
    tty: true
    depends_on:
      - backend
    command: npm start

networks:
  app_network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
